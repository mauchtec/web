<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Workflow Builder{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #f5f7fa; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
        .navbar { background: linear-gradient(90deg, #6366f1, #3b82f6); color: #fff; padding: 0 32px; height: 60px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(59,130,246,0.08); }
        .navbar .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; margin-right: 32px; }
        .navbar .menu { display: flex; gap: 24px; }
        .navbar .menu a { color: #fff; text-decoration: none; font-weight: 500; font-size: 1rem; transition: color 0.2s; }
        .navbar .menu a:hover { color: #dbeafe; }
        .navbar .user { margin-left: auto; font-size: 1rem; font-weight: 500; }
        .content { min-height: 80vh; }
        .footer { background: #f3f4f6; color: #64748b; text-align: center; padding: 18px 0; font-size: 0.98rem; border-top: 1px solid #e5e7eb; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <span class="logo"><i class="fa-solid fa-cubes"></i> AccessControll</span>
        <div class="menu">
            <a href="/builder/">Builder</a>
            <a href="/workflows/">Workflows</a>
            <a href="/admin/">Admin</a>
            <a href="/api/v1/components/" target="_blank">API</a>
        </div>
        <span class="user">{% if user.is_authenticated %}Hello, {{ user.username }}{% else %}<a href="/api-auth/login/" style="color:#fff;">Login</a>{% endif %}</span>
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        &copy; {{ year|default:2026 }} AccessControll &mdash; Professional Workflow Platform
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
