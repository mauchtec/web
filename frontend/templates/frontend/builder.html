{% extends "frontend/base.html" %}
{% block title %}Workflow Builder{% endblock %}
{% block head %}
    <style>
        :root {
            --primary-bg: #fff;
            --secondary-bg: #f9fafb;
            --canvas-bg: #f3f4f6;
            --card-bg: #fff;
            --card-border: #e5e7eb;
            --input-bg: #fff;
            --input-border: #e5e7eb;
            --input-text: #1e293b;
            --preview-bg: #f3f4f6;
            --preview-border: #e5e7eb;
            --preview-text: #1e293b;
            --primary-text: #1e293b;
            --secondary-text: #374151;
            --accent: #6366f1;
        }
        [data-theme="dark"] {
            --primary-bg: #18181b;
            --secondary-bg: #232336;
            --canvas-bg: #1e1e2e;
            --card-bg: #232336;
            --card-border: #373757;
            --input-bg: #232336;
            --input-border: #373757;
            --input-text: #e0e7ef;
            --preview-bg: #232336;
            --preview-border: #373757;
            --preview-text: #e0e7ef;
            --primary-text: #e0e7ef;
            --secondary-text: #a5b4fc;
            --accent: #6366f1;
        }
        body { background: var(--primary-bg); color: var(--primary-text); }
        .builder-container { max-width: 1500px; margin: 40px auto; background: var(--primary-bg); border-radius: 16px; box-shadow: 0 6px 32px rgba(0,0,0,0.10); padding: 48px; display: flex; gap: 48px; }
        @media (max-width: 900px) {
            .builder-container { flex-direction: column; gap: 0; padding: 20px; }
            .component-list { width: 100%; min-width: 0; margin-bottom: 28px; max-height: 360px; overflow-y: auto; }
            .canvas-area { min-height: 500px; padding: 18px; width: 100%; min-width: 0; }
        }
        @media (max-width: 600px) {
            .builder-container { max-width: 100vw; margin: 0; border-radius: 0; box-shadow: none; }
            .component-list, .canvas-area { border-radius: 0; box-shadow: none; padding: 10px; width: 100%; min-width: 0; }
            .component-list h2 { font-size: 1.15rem; }
            .canvas-step { padding: 16px; font-size: 1.05em; }
            .save-btn { font-size: 1.1em; padding: 14px 24px; }
            .component-list { max-height: 260px; overflow-y: auto; }
        }
        .component-list { width: 400px; background: var(--secondary-bg); border-radius: 14px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .component-list h2 { font-size: 1.35rem; margin-bottom: 22px; color: var(--secondary-text); }
        .component-item { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: 12px; padding: 22px 28px; margin-bottom: 18px; cursor: grab; display: flex; align-items: center; gap: 18px; transition: box-shadow 0.2s, transform 0.2s; font-size: 1em; }
        .component-item:hover { box-shadow: 0 4px 16px rgba(99,102,241,0.14); transform: scale(1.05); }
        .component-item.dragging { box-shadow: 0 12px 32px rgba(99,102,241,0.22); transform: scale(1.10); opacity: 0.90; z-index: 10; }
        .component-icon { font-size: 1.3rem; }
        .component-label { font-weight: 700; color: var(--primary-text); font-size: 1em; }
        .canvas-area { flex: 1;
            min-height: 700px;
            background: var(--canvas-bg);
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            position: sticky;
            top: 32px;
            align-self: flex-start;
            z-index: 10;
        }
        .component-list-search {
            width: 100%;
            margin-bottom: 18px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--card-border);
            font-size: 1em;
            background: var(--input-bg);
            color: var(--input-text);
        }
        .canvas-dropzone { min-height: 500px; border: 2.5px dashed var(--accent); border-radius: 14px; background: var(--card-bg); padding: 40px; display: flex; flex-direction: column; gap: 28px; }
        .canvas-dropzone.dragover { background: linear-gradient(90deg, #e0e7ff 60%, var(--canvas-bg) 100%); box-shadow: 0 0 0 6px #a5b4fc33; transition: background 0.3s, box-shadow 0.3s; }
        .canvas-step { background: var(--secondary-bg); border: 1.5px solid var(--card-border); border-radius: 12px; padding: 28px; margin-bottom: 16px; position: relative; font-size: 1.13em; color: var(--primary-text); }
        .canvas-step .remove-btn { position: absolute; top: 14px; right: 14px; background: #fee2e2; color: #b91c1c; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 1em; }
        .canvas-step .remove-btn:hover { background: #fecaca; }
        .preview-area {
            background: var(--preview-bg);
            color: var(--preview-text);
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            padding: 40px;
            border: 1.5px solid var(--preview-border);
        }
        .save-btn { margin-top: 32px; background: linear-gradient(135deg, var(--accent), #3b82f6); color: #fff; border: none; border-radius: 12px; padding: 20px 44px; font-size: 1.25rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .save-btn:hover { background: linear-gradient(135deg, #3b82f6, var(--accent)); }
        .theme-switcher { position: absolute; top: 18px; right: 32px; z-index: 100; }
        .theme-btn { background: var(--secondary-bg); color: var(--primary-text); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 18px; font-size: 1.05em; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .theme-btn:hover { background: var(--accent); color: #fff; }
        .component-item input,
        .component-item textarea,
        .component-item select {
            background: var(--input-bg);
            color: var(--input-text);
            border: 1.5px solid var(--input-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1em;
        }
        .component-preview,
        .signature-pad,
        .photo-preview {
            background: var(--preview-bg) !important;
            color: var(--preview-text);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 1px 4px rgba(99,102,241,0.07);
            border: 1.5px solid var(--preview-border);
        }
        /* Add this to the style block for dark mode preview backgrounds */
        [data-theme="dark"] .component-preview,
        [data-theme="dark"] .signature-pad,
        [data-theme="dark"] .photo-preview {
            background: var(--preview-bg) !important;
            color: var(--preview-text) !important;
        }
        [data-theme="dark"] .preview-area {
            background: var(--preview-bg) !important;
            color: var(--preview-text) !important;
        }
        [data-theme="dark"] .element-style-preview {
            background: var(--preview-bg) !important;
            color: var(--preview-text) !important;
        }
    </style>
{% endblock %}
{% block content %}
<div class="builder-container">
    <button class="theme-btn theme-switcher" onclick="toggleTheme()">Switch Theme</button>
    <div class="component-list">
        <h2 style="display:flex;align-items:center;justify-content:space-between;">
            <span>Components</span>
            <button id="reloadComponentsBtn" style="background:#e0e7ef;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:0.95em;">Reload</button>
        </h2>
        <input id="componentSearch" class="component-list-search" type="text" placeholder="Search components..." oninput="filterComponentList()" />
        <div id="componentList"></div>
        <div id="componentDebug" style="margin-top:18px;font-size:0.95em;color:#64748b;"></div>
    </div>
    <div class="canvas-area">
        <h2>Workflow Canvas</h2>
        <div id="canvasDropzone" class="canvas-dropzone"></div>
        <button class="save-btn" onclick="saveWorkflow()">Save Workflow</button>
        <div class="preview-area">
            <h3>Live Preview</h3>
            <div id="livePreview"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
// Fetch components from API
async function fetchComponents() {
    const res = await fetch('/api/v1/components/', { credentials: 'same-origin' });
    const data = await res.json();
    return data.components;
}

// Render component list with drag animation
function renderComponentList(components) {
    const list = document.getElementById('componentList');
    list.innerHTML = '';
    components.forEach(comp => {
        const item = document.createElement('div');
        item.className = 'component-item';
        item.draggable = true;
        item.dataset.type = comp.type;
        item.innerHTML = `
            <span class="component-icon">${comp.icon}</span> <span class="component-label">${comp.label}</span>
            <div class="component-preview" style="margin-top:10px; background:#f3f4f6; border-radius:8px; padding:10px; box-shadow:0 1px 4px rgba(99,102,241,0.07);">
                ${comp.html_preview}
            </div>
        `;
        item.addEventListener('dragstart', e => {
            e.dataTransfer.setData('componentType', comp.type);
            setTimeout(() => item.classList.add('dragging'), 0);
        });
        item.addEventListener('dragend', e => {
            item.classList.remove('dragging');
        });
        list.appendChild(item);
    });
    // Debug: show raw component types
    document.getElementById('componentDebug').innerText = 'Fetched component types: ' + components.map(c => c.type).join(', ');
}

// Drag and drop logic
const dropzone = document.getElementById('canvasDropzone');
let workflowSteps = [];

dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', e => {
    dropzone.classList.remove('dragover');
});
dropzone.addEventListener('drop', async e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const type = e.dataTransfer.getData('componentType');
    const comp = (await fetchComponents()).find(c => c.type === type);
    if (comp) {
        const step = {
            id: `${type}_${Math.random().toString(36).substr(2, 6)}`,
            type: comp.type,
            props: Object.fromEntries(comp.fields.map(f => [f.name, f.default || '']))
        };
        workflowSteps.push(step);
        renderCanvas();
        updatePreview();
    }
});

function renderCanvas() {
    dropzone.innerHTML = '';
    workflowSteps.forEach((step, idx) => {
        const div = document.createElement('div');
        div.className = 'canvas-step';
        div.innerHTML = `
            <b>${step.type}</b>
            <button class='remove-btn' onclick='removeStep(${idx})'>Remove</button>
            <button style="margin-left:8px;" onclick='moveStep(${idx}, -1)' ${idx === 0 ? 'disabled' : ''} title="Move Up">&#8593;</button>
            <button style="margin-left:4px;" onclick='moveStep(${idx}, 1)' ${idx === workflowSteps.length-1 ? 'disabled' : ''} title="Move Down">&#8595;</button>
            <button style="margin-left:8px;background:#e0e7ef;color:#374151;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:0.95em;" onclick='editStep(${idx})'>Edit</button>
            <div id="edit-form-${idx}" style="display:none;margin-top:12px;"></div>
        `;
        dropzone.appendChild(div);
    });
}

async function editStep(idx) {
    const step = workflowSteps[idx];
    const comp = (await fetchComponents()).find(c => c.type === step.type);
    if (!comp) return;
    const formDiv = document.getElementById(`edit-form-${idx}`);
    if (!formDiv) return;
    // Build form HTML
    let formHtml = '<form onsubmit="return false;">';
    comp.fields.forEach(field => {
        const value = step.props[field.name] ?? '';
        formHtml += `<div style='margin-bottom:10px;'>`;
        formHtml += `<label style='font-weight:500;color:#374151;'>${field.label}:</label><br>`;
        if (field.type === 'text' || field.type === 'number') {
            formHtml += `<input type='${field.type}' name='${field.name}' value='${value}' style='width:90%;padding:6px;border-radius:6px;border:1px solid #e5e7eb;' ${field.required?'required':''}>`;
        } else if (field.type === 'textarea') {
            formHtml += `<textarea name='${field.name}' style='width:90%;padding:6px;border-radius:6px;border:1px solid #e5e7eb;' ${field.required?'required':''}>${value}</textarea>`;
        } else if (field.type === 'select' && field.options) {
            formHtml += `<select name='${field.name}' style='width:92%;padding:6px;border-radius:6px;border:1px solid #e5e7eb;' ${field.required?'required':''}>`;
            field.options.forEach(opt => {
                formHtml += `<option value='${opt}' ${value==opt?'selected':''}>${opt}</option>`;
            });
            formHtml += `</select>`;
        } else if (field.type === 'checkbox') {
            formHtml += `<input type='checkbox' name='${field.name}' ${value?'checked':''}>`;
        }
        formHtml += `<span class='error-message' style='color:#ef4444;font-size:0.95em;display:none;margin-left:8px;'></span>`;
        formHtml += `</div>`;
    });
    formHtml += `<button type='submit' style='background:#6366f1;color:#fff;border:none;border-radius:6px;padding:6px 18px;font-size:1em;cursor:pointer;'>Save</button> `;
    formHtml += `<button type='button' style='background:#e5e7eb;color:#374151;border:none;border-radius:6px;padding:6px 18px;font-size:1em;cursor:pointer;margin-left:8px;' onclick='closeEditForm(${idx})'>Cancel</button>`;
    formHtml += '</form>';
    formDiv.innerHTML = formHtml;
    formDiv.style.display = 'block';
    // Save handler
    formDiv.querySelector('form').onsubmit = function() {
        let valid = true;
        comp.fields.forEach(field => {
            let val;
            const input = formDiv.querySelector(`[name='${field.name}']`);
            const errorSpan = input.parentElement.querySelector('.error-message');
            if (field.type === 'checkbox') {
                val = input.checked;
            } else {
                val = input.value;
                if (field.type === 'number') val = Number(val);
            }
            // Validation for required fields
            if (field.required && (val === '' || val === null || (field.type === 'number' && isNaN(val)))) {
                errorSpan.textContent = 'Required';
                errorSpan.style.display = 'inline';
                valid = false;
            } else {
                errorSpan.textContent = '';
                errorSpan.style.display = 'none';
            }
            step.props[field.name] = val;
        });
        if (!valid) return false;
        formDiv.style.display = 'none';
        renderCanvas();
        updatePreview();
    };
}

function closeEditForm(idx) {
    const formDiv = document.getElementById(`edit-form-${idx}`);
    if (formDiv) formDiv.style.display = 'none';
}


function moveStep(idx, direction) {
    const newIndex = idx + direction;
    if (newIndex < 0 || newIndex >= workflowSteps.length) return;
    const temp = workflowSteps[idx];
    workflowSteps[idx] = workflowSteps[newIndex];
    workflowSteps[newIndex] = temp;
    renderCanvas();
    updatePreview();
}

function removeStep(idx) {
    workflowSteps.splice(idx, 1);
    renderCanvas();
    updatePreview();
}

async function updatePreview() {
    // Defensive: support both definition.components and definition.steps
    let components = null;
    // Try to get from workflowSteps (builder state)
    if (Array.isArray(workflowSteps)) {
        components = workflowSteps;
    }
    // If not, try to get from definition (for future extensibility)
    // (You can add more shapes here if needed)
    if (!components || !Array.isArray(components)) {
        document.getElementById('livePreview').innerHTML = '<span style="color:#64748b;">Invalid workflow definition.</span>';
        return;
    }
    const res = await fetch('/api/v1/preview/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ components })
    });
    if (!res.ok) {
        document.getElementById('livePreview').innerHTML = '<span style="color:#ef4444;">Preview failed.</span>';
        return;
    }
    let data = null;
    try {
        data = await res.json();
    } catch (e) {
        document.getElementById('livePreview').innerHTML = '<span style="color:#ef4444;">Preview response error.</span>';
        return;
    }
    if (!data || typeof data.html !== 'string') {
        document.getElementById('livePreview').innerHTML = '<span style="color:#ef4444;">No preview available.</span>';
        return;
    }
    document.getElementById('livePreview').innerHTML = data.html;
}


let currentWorkflowId = null;
let currentWorkflowName = '';

async function saveWorkflow() {
    const definition = { steps: workflowSteps };
    let url, method, payload;
    if (currentWorkflowId) {
        // Update existing workflow
        url = `/api/v1/workflow/${currentWorkflowId}/`;
        method = 'PUT';
        payload = {
            name: currentWorkflowName,
            definition: definition
        };
    } else {
        // Create new workflow
        const name = prompt('Enter workflow name:');
        if (!name) return;
        url = '/api/v1/save/';
        method = 'POST';
        payload = {
            name: name,
            description: '',
            version: '1.0.0',
            status: 'draft',
            definition: definition
        };
    }
    const res = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.id) {
        alert('Workflow saved! ID: ' + data.id);
        window.location.hash = data.id;
        currentWorkflowId = data.id;
    } else {
        alert('Save failed: ' + (data.error || 'Unknown error'));
    }
}

async function loadWorkflow(id) {
    const res = await fetch(`/api/v1/workflow/${id}/`, { credentials: 'same-origin' });
    if (!res.ok) { alert('Workflow not found.'); return; }
    const data = await res.json();
    if (data.definition && data.definition.steps) {
        workflowSteps = data.definition.steps;
        currentWorkflowId = data.id;
        currentWorkflowName = data.name;
        renderCanvas();
        updatePreview();
    }
}

// Auto-load workflow if hash is present
if (window.location.hash.length > 1) {
    loadWorkflow(window.location.hash.substring(1));
}

// Init
let allComponents = [];

async function fetchAndRenderComponents() {
    allComponents = await fetchComponents();
    renderComponentList(allComponents);
}

function filterComponentList() {
    const search = document.getElementById('componentSearch').value.toLowerCase();
    const filtered = allComponents.filter(c =>
        c.label.toLowerCase().includes(search) ||
        (c.description && c.description.toLowerCase().includes(search))
    );
    renderComponentList(filtered);
}

// On page load
fetchAndRenderComponents();

document.getElementById('reloadComponentsBtn').addEventListener('click', function() {
    fetchAndRenderComponents();
});

// Theme switcher logic
function toggleTheme() {
    const html = document.documentElement;
    if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
    }
}
// On load, set theme from localStorage
(function() {
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
</script>
{% endblock %}
